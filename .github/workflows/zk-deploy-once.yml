name: Verify deployed ZK release

on:
  push:
    branches: ["codex/zk-deploy-20261122"]

permissions:
  contents: read

# Share the release lock without cancelling or starting a Hub release.
concurrency:
  group: inventory-hub-production
  cancel-in-progress: false

jobs:
  deploy-zk:
    if: github.repository == 'mpriesol/inventory_hub' && github.event_name == 'push' && github.ref == 'refs/heads/codex/zk-deploy-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Verify deployed source and automatic daily backup
        shell: bash
        env:
          GITHUB: 'true'
          INPUT_HOST: ${{ secrets.DEPLOY_HOST }}
          INPUT_USERNAME: ${{ secrets.DEPLOY_USER }}
          INPUT_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          INPUT_TIMEOUT: 30s
          INPUT_COMMAND_TIMEOUT: 5m
          INPUT_SCRIPT: |
            bash -se <<'ZK_VERIFY'
            #!/usr/bin/env bash
            set -euo pipefail
            cd /opt/cestou-zimy
            [[ $(git rev-parse HEAD) == 6b43fcc685f37e513ae5638f82a13101691641ff ]]
            [[ -z $(git status --porcelain --untracked-files=normal) ]]
            ZK_CID=$(docker ps --filter label=com.docker.compose.project=cestou-zimy --filter label=com.docker.compose.service=zk-app --format '{{.ID}}')
            [[ "$ZK_CID" =~ ^[a-f0-9]{12,64}$ ]]
            [[ $(docker inspect --format '{{.State.Health.Status}}' "$ZK_CID") == healthy ]]
            [[ $(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}' "$ZK_CID") == cestou-zimy_zk_data ]]
            [[ $(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/backups"}}{{.Type}}:{{.Source}}{{end}}{{end}}' "$ZK_CID") == bind:/srv/cestou-zimy-backups ]]
            docker exec "$ZK_CID" node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            import crypto from "node:crypto";
            import { schedulerMode } from "./server/backup-scheduler.ts";
            const assert=(ok,code)=>{if(!ok)throw Error(code);};
            const dir="/backups",cid=process.env.COURSE_ID||"cestou-zimy";
            assert(schedulerMode(process.env,dir)==="internal","unexpected_scheduler");
            assert(process.env.BACKUP_TIME==="03:15","unexpected_backup_time");
            assert(process.env.BACKUP_RETENTION==="30","unexpected_backup_retention");
            const s=JSON.parse(fs.readFileSync(path.join(dir,"last-status.json"),"utf8"));
            assert(!s.lastError&&s.lastSuccess?.at,"backup_status_not_successful");
            const daily=fs.readdirSync(dir).filter(n=>n.endsWith(".manifest.json")).map(n=>JSON.parse(fs.readFileSync(path.join(dir,n),"utf8"))).filter(m=>m.version===1&&m.reason==="daily"&&m.courseId===cid&&typeof m.database==="string"&&path.basename(m.database)===m.database).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))[0];
            assert(daily&&Array.isArray(daily.media),"daily_manifest_missing");
            const parts=new Intl.DateTimeFormat("en-CA",{timeZone:daily.timezone,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
            const val=k=>parts.find(x=>x.type===k).value;
            const today=`${val("year")}-${val("month")}-${val("day")}`;
            assert(daily.scheduleDate===today,"daily_snapshot_date_mismatch");
            const file=path.join(dir,daily.database),hash=p=>crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex");
            assert(hash(file)===daily.databaseSha256,"daily_database_hash_mismatch");
            assert(fs.statSync(file+".assets").isDirectory(),"daily_assets_missing");
            for(const a of daily.media){assert(/^[a-f0-9-]{36}\.webp$/.test(a.storageName),"invalid_asset_name");assert(hash(file+".assets/"+a.storageName)===a.sha256,"daily_asset_hash_mismatch");}
            console.log("zk-verify "+JSON.stringify({scheduler:"internal",time:process.env.BACKUP_TIME,retention:Number(process.env.BACKUP_RETENTION),lastAttemptFailed:false,lastSuccessAt:s.lastSuccess.at,lastSuccessReason:s.lastSuccess.reason,dailySnapshotVerified:true,dailyScheduleDate:daily.scheduleDate,dailyTimezone:daily.timezone}));
            '
            printf 'zk-verify approved_source=true checkout_clean=true health=true original_volume=true external_backup_bind=true\n'
            ZK_VERIFY
        run: |
          docker run --rm --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --env GITHUB --env INPUT_HOST --env INPUT_USERNAME \
            --env INPUT_KEY --env INPUT_TIMEOUT --env INPUT_COMMAND_TIMEOUT \
            --env INPUT_SCRIPT \
            ghcr.io/appleboy/drone-ssh:1.8.0@sha256:cd14570676f022faf800e7a92ef26025fcb834e0943c199b6a6aa8d8802e383f
