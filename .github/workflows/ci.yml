name: pull-request-checks

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend-compile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: catalog_test
          POSTGRES_PASSWORD: catalog_test
          POSTGRES_DB: inventory_hub_catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalog_test -d inventory_hub_catalog_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile backend
        run: python -m compileall -q api/inventory_hub

      - name: Install backend dependencies
        run: python -m pip install -r api/requirements.txt

      - name: Run backend and isolated catalog database tests
        env:
          PYTHONPATH: api
          CATALOG_TEST_DATABASE_URL: postgresql://catalog_test:catalog_test@localhost:5432/inventory_hub_catalog_test
        run: python -m unittest discover -s api/tests -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build
