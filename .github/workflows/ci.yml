name: pull-request-checks

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend-compile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: catalog_test
          POSTGRES_PASSWORD: catalog_test
          POSTGRES_DB: inventory_hub_catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalog_test -d inventory_hub_catalog_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile backend
        run: python -m compileall -q api/inventory_hub

      - name: Install backend dependencies
        run: python -m pip install -r api/requirements.txt

      - name: Run backend and isolated catalog database tests
        env:
          PYTHONPATH: api
          CATALOG_TEST_DATABASE_URL: postgresql://catalog_test:catalog_test@localhost:5432/inventory_hub_catalog_test
        run: python -m unittest discover -s api/tests -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Check supplier catalog interactions
        run: node frontend/tests/catalog-ui.cjs

      - name: Check AI content preparation and review
        run: node frontend/tests/ai-content-ui.cjs

      - name: Check product-only Upgates import
        run: node frontend/tests/upgates-import-ui.cjs

      - name: Check supplier availability configuration
        run: node frontend/tests/supplier-config-ui.cjs

      - name: Check protected order audit interactions
        run: node frontend/tests/order-audit-ui.cjs

      - name: Check controlled opening stock interactions
        run: node frontend/tests/opening-stock-ui.cjs

      - name: Check controlled order stock processing
        run: node frontend/tests/order-stock-ui.cjs

      - name: Check order collection and stock draft interactions
        run: node frontend/tests/order-collection-ui.cjs

      - name: Check stock automation settings interactions
        run: node frontend/tests/stock-settings-ui.cjs
      - name: Stock publication interaction checks
        run: node frontend/tests/stock-publication-ui.cjs

      - name: Product editor interaction checks
        run: node frontend/tests/product-editor-ui.cjs

      - name: FIFO inventory interactions
        run: node frontend/tests/fifo-ui.cjs

      - name: Receiving scanner replay and queue interactions
        run: node frontend/tests/receiving-scan-ui.cjs

      - name: Movement history and dashboard interactions
        run: node frontend/tests/stock-history-ui.cjs
