name: pull-request-checks

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: catalog_test
          POSTGRES_PASSWORD: catalog_test
          POSTGRES_DB: inventory_hub_catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalog_test -d inventory_hub_catalog_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Compile backend
        run: python -m compileall -q api/inventory_hub

      - name: Install backend dependencies
        run: python -m pip install -r api/requirements.txt

      - name: Run backend and isolated catalog database tests
        env:
          PYTHONPATH: api
          CATALOG_TEST_DATABASE_URL: postgresql://catalog_test:catalog_test@localhost:5432/inventory_hub_catalog_test
        run: >-
          python scripts/ci_backend_tests.py
          --shard-index ${{ matrix.shard }} --shard-count 4
          --report artifacts/backend-${{ matrix.shard }}.json
          --require-database --summary "$GITHUB_STEP_SUMMARY"

      - name: Save backend test timings and inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-${{ matrix.shard }}
          path: artifacts/backend-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

  # Keep the existing required check name; all four shards must pass this gate.
  backend-compile:
    if: always()
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Collect backend reports
        uses: actions/download-artifact@v4
        with:
          pattern: backend-test-*
          path: artifacts
          merge-multiple: true
      - name: Verify complete backend coverage
        run: >-
          python scripts/ci_backend_tests.py
          --verify-reports 'artifacts/backend-*.json' --shard-count 4
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Require every backend shard to succeed
        env:
          SHARD_RESULT: ${{ needs.backend-tests.result }}
        run: test "$SHARD_RESULT" = success

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Check supplier catalog interactions
        run: node frontend/tests/catalog-ui.cjs

      - name: Check configurable supplier feed mapping
        run: node frontend/tests/feed-mapping-ui.cjs

      - name: Check unified product import interactions
        run: node frontend/tests/product-import-ui.cjs

      - name: Check invoice archive and product trace interactions
        run: |
          node frontend/tests/invoices-ui.cjs
          node frontend/tests/invoice-calendar-ui.cjs
          node frontend/tests/product-trace-ui.cjs

      - name: Check import identity review interactions
        run: node frontend/tests/product-import-identity-ui.cjs

      - name: Check AI content preparation and review
        run: node frontend/tests/ai-content-ui.cjs

      - name: Check persistent account sessions
        run: node frontend/tests/accounts-ui.cjs

      - name: Check product-only Upgates import
        run: node frontend/tests/upgates-import-ui.cjs

      - name: Check supplier availability configuration
        run: |
          node frontend/tests/supplier-config-ui.cjs
          node frontend/tests/zookee-codes-ui.cjs

      - name: Check read-only Sloger lookup and recovery
        run: node frontend/tests/sloger-probe-ui.cjs

      - name: Check protected order audit interactions
        run: node frontend/tests/order-audit-ui.cjs

      - name: Check controlled opening stock interactions
        run: node frontend/tests/opening-stock-ui.cjs

      - name: Check controlled order stock processing
        run: node frontend/tests/order-stock-ui.cjs

      - name: Check order collection and stock draft interactions
        run: node frontend/tests/order-collection-ui.cjs

      - name: Check stock automation settings interactions
        run: node frontend/tests/stock-settings-ui.cjs
      - name: Stock publication interaction checks
        run: node frontend/tests/stock-publication-ui.cjs

      - name: Product editor interaction checks
        run: node frontend/tests/product-editor-ui.cjs

      - name: Existing product link interaction checks
        run: node frontend/tests/product-links-ui.cjs

      - name: Supplier card link interaction checks
        run: node frontend/tests/supplier-links-ui.cjs

      - name: FIFO inventory interactions
        run: node frontend/tests/fifo-ui.cjs

      - name: Receiving scanner replay and queue interactions
        run: |
          node frontend/tests/receiving-scan-ui.cjs
          node frontend/tests/receiving-lookup-ui.cjs

      - name: Movement history and dashboard interactions
        run: node frontend/tests/stock-history-ui.cjs

      - name: Supplier availability and regular transfer interactions
        run: node frontend/tests/availability-sync-ui.cjs

      - name: Physical stock correction interactions
        run: node frontend/tests/stock-adjustments-ui.cjs

      - name: FIFO purchase cost publication interactions
        run: node frontend/tests/fifo-cost-sync-ui.cjs
