name: build

on:
  push:
    branches: ["main", "codex/deployment-lock-diagnostic"]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after building (disable for a cache benchmark)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  actions: read

# Serialize the entire release, including mutable image tags. Never cancel migrations.
concurrency:
  group: inventory-hub-production
  cancel-in-progress: false

jobs:
  recover-deployment-locks:
    # Scoped recovery, reviewed separately from the earlier read-only diagnosis.
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/deployment-lock-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Recover the two verified orphan migrations and the verified API
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 360s
          script: |
            set -eu
            cd /opt/inventory-hub

            old_api=e315fed17cb21f11abcf637b280a7a7d116cf8f6a3e455a2be8dd880351ea0c4
            old_image=sha256:ce1f53a3b052a3615f821123551498d1d0dc8cc4e2d2722734da055fcf2fd7f8
            new_image=sha256:eddf99eb7284c4d17899eaf7d0092d1afffe5f137d849d5a7f2cda668516b9fc
            recovery_name=inventory-hub-atomer-recovery-156

            compose() { docker compose -f docker-compose.yml -f docker-compose.ai-content.yml "$@"; }
            test "$(compose ps -q api)" = "$old_api"
            test "$(docker inspect --format '{{.Image}}' "$old_api")" = "$old_image"
            test "$(docker inspect --format '{{.State.Running}}' "$old_api")" = true
            test "$(docker inspect --format '{{.State.StartedAt}}' "$old_api")" = 2026-11-05T19:52:59.908429137Z
            test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$old_api")" = inventory-hub
            test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$old_api")" = api
            test "$(docker image inspect ghcr.io/mpriesol/inventory-hub-api:main --format '{{.Id}}')" = "$new_image"
            if docker inspect "$recovery_name" >/dev/null 2>&1; then
              printf '%s\n' 'Recovery container already exists; inspect its result, do not replay.'
              exit 1
            fi

            guard_migration() {
              container="$1"
              expected_name="$2"
              test "$(docker inspect --format '{{.Name}}' "$container")" = "/$expected_name"
              test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$container")" = inventory-hub
              test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$container")" = api
              test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.oneoff"}}' "$container")" = True
              test "$(docker inspect --format '{{json .Config.Cmd}}' "$container")" = '["python","-m","inventory_hub.migrate"]'
              test "$(docker inspect --format '{{.State.Running}}' "$container")" = true
            }
            guard_migration a4799ec676c0 inventory-hub-api-run-8c1098a80737
            guard_migration d061b1b61982 inventory-hub-api-run-e5c9ca4d9040
            test "$(docker inspect --format '{{.Image}}' d061b1b61982)" = "$new_image"
            old_orphan=$(docker inspect --format '{{.Id}}' a4799ec676c0)
            new_orphan=$(docker inspect --format '{{.Id}}' d061b1b61982)

            # Prove the pinned image is the reviewed release. No settings, credentials or
            # application data are read by this isolated image check.
            docker run --rm -i --network none --entrypoint python "$new_image" - <<'PY'
            from hashlib import sha256
            from pathlib import Path
            expected = {
                'services/product_links.py': '23c3bac03b64632f17f3af20bcec2aa76edabbb5a676032db663d7b4044cb113',
                'main.py': '6f6ae1713411911d5295e987462a6e72fbe09893c123c08e7749dc89e1e87ba3',
                'settings.py': '1b8e96ae5a3aeb1e55902c95f1b1850430db9703cb35c62e6393f6bc9e4355f5',
            }
            for path, digest in expected.items():
                assert sha256((Path('/app/inventory_hub') / path).read_bytes()).hexdigest() == digest
            print('PINNED_RELEASE_SOURCE_VERIFIED 5a27335334bac514225ed2853d63d24d62c87fac')
            PY
            schema_digest='from pathlib import Path; from hashlib import sha256; p=Path("/app/inventory_hub/migrations"); assert p.is_dir(); files=sorted(p.glob("*.sql")); assert files; print(sha256(b"".join(x.name.encode()+b"\0"+x.read_bytes() for x in files)).hexdigest())'
            old_schema=$(docker exec "$old_api" python -c "$schema_digest")
            new_schema=$(docker run --rm --network none --entrypoint python "$new_image" -c "$schema_digest")
            test "$old_schema" = "$new_schema"
            printf '%s\n' 'MIGRATION_SQL_IDENTICAL_TO_RUNNING_RELEASE'

            workdir=$(mktemp -d /opt/inventory-hub/recovery-156.XXXXXX)
            cat > "$workdir/new.yml" <<YAML
            services:
              api:
                image: "$new_image"
                environment:
                  ATOMER_CATALOG_WORKER_ENABLED: "false"
            YAML
            cat > "$workdir/rollback.yml" <<YAML
            services:
              api:
                image: "$old_image"
                command:
                  - python
                  - -c
                  - |
                      import asyncio
                      import uvicorn
                      from inventory_hub.services import atomer_catalog_engine as catalog
                      from inventory_hub.services import atomer_catalog_source_cards as cards
                      async def paused():
                          await asyncio.Event().wait()
                      catalog.run = paused
                      cards.run = paused
                      uvicorn.run("inventory_hub.main:app", host="0.0.0.0", port=8000)
            YAML
            compose -f "$workdir/new.yml" config --quiet
            compose -f "$workdir/rollback.yml" config --quiet
            stopped_api=false
            completed=false
            recovery_container=''

            healthy() {
              deadline=$(( $(date +%s) + 60 ))
              while [ "$(date +%s)" -lt "$deadline" ]; do
                if compose exec -T api python -m inventory_hub.security_check --timeout 12; then
                  return 0
                fi
                sleep 3
              done
              return 1
            }

            finish() {
              result=$?
              trap - EXIT INT TERM
              set +e
              if [ "$completed" != true ] && [ "$stopped_api" = true ]; then
                if [ -n "$recovery_container" ] && docker inspect "$recovery_container" >/dev/null 2>&1; then
                  # This is only the one container created and captured by this invocation.
                  docker stop --time 10 "$recovery_container" >/dev/null 2>&1
                fi
                printf '%s\n' 'RECOVERY_FAILED_RESTORING_PREVIOUS_API_WITH_ATOMER_WORKERS_PAUSED'
                if compose -f "$workdir/rollback.yml" up -d --no-deps --force-recreate api && healthy; then
                  printf '%s\n' 'ROLLBACK_HEALTHY_OLD_API_ATOMER_WORKERS_PAUSED_REPLACEMENT_FIX_NOT_DEPLOYED'
                else
                  printf '%s\n' 'ROLLBACK_HEALTH_FAILED_OPERATOR_ACTION_REQUIRED'
                fi
              fi
              rm -f "$workdir/new.yml" "$workdir/rollback.yml"
              rmdir "$workdir"
              exit "$result"
            }
            trap finish EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM

            printf '%s\n' 'STOPPING_TWO_VERIFIED_ORPHAN_MIGRATIONS'
            docker stop --time 10 "$old_orphan" "$new_orphan"
            printf '%s\n' 'STOPPING_VERIFIED_OLD_API'
            stopped_api=true
            docker stop --time 30 "$old_api"

            printf '%s\n' 'RUNNING_ONE_BOUNDED_MIGRATION'
            recovery_container=$(compose -f "$workdir/new.yml" run -d --no-deps --name "$recovery_name" \
              -e 'PGOPTIONS=-c lock_timeout=5000 -c statement_timeout=60000 -c idle_in_transaction_session_timeout=60000' \
              api python -m inventory_hub.migrate)
            migration_exit=$(timeout --signal=TERM 150 docker wait "$recovery_container")
            docker logs "$recovery_container"
            test "$migration_exit" = 0

            printf '%s\n' 'STARTING_VERIFIED_NEW_API'
            compose -f "$workdir/new.yml" up -d --no-deps --force-recreate api
            current_api=$(compose ps -q api)
            test "$(docker inspect --format '{{.Image}}' "$current_api")" = "$new_image"
            compose exec -T api python - <<'PY'
            from hashlib import sha256
            from pathlib import Path
            from inventory_hub.settings import settings
            assert not settings.ATOMER_CATALOG_WORKER_ENABLED
            assert sha256(Path('/app/inventory_hub/services/product_links.py').read_bytes()).hexdigest() == '23c3bac03b64632f17f3af20bcec2aa76edabbb5a676032db663d7b4044cb113'
            print('NEW_API_CODE_VERIFIED_ATOMER_WORKERS_DISABLED')
            PY
            healthy
            completed=true
            printf '%s\n' 'RECOVERY_DEPLOYMENT_HEALTHY 5a27335334bac514225ed2853d63d24d62c87fac'

  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            dockerfile: api/Dockerfile
            build_args: ''
          - image: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
            build_args: VITE_API_BASE=/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ (github.event_name != 'workflow_dispatch' || inputs.deploy) && format('ghcr.io/mpriesol/inventory-hub-{0}:main', matrix.image) || '' }}
            ghcr.io/mpriesol/inventory-hub-${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
      if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.deploy)
      needs: build-and-push
      runs-on: ubuntu-latest
      steps:
        - name: Deploy to hub.biketrek.sk
          uses: appleboy/ssh-action@v1.2.0
          with:
            host: ${{ secrets.DEPLOY_HOST }}
            username: ${{ secrets.DEPLOY_USER }}
            key: ${{ secrets.DEPLOY_SSH_KEY }}
            script: |
              set -eu
              cd /opt/inventory-hub
              if [ ! -f ai-content.env ]; then
                install -m 600 /dev/null ai-content.env
              fi
              cat > docker-compose.ai-content.yml <<'YAML'
              services:
                api:
                  environment:
                    SUPPLIER_CREDENTIALS_ROOT: /var/lib/inventory-hub-secrets
                  volumes:
                    - ./ai-content.env:/run/secrets/hub-ai.env:ro
                    - supplier_secrets:/var/lib/inventory-hub-secrets
                caddy:
                  networks:
                    sps_proxy: {}
              volumes:
                supplier_secrets:
              networks:
                sps_proxy:
                  external: true
                  name: sps-proxy
              YAML
              run_phase() {
                phase_name="$1"
                shift
                phase_started=$(date +%s)
                printf 'DEPLOY_PHASE %s start\n' "$phase_name"
                if "$@"; then
                  printf 'DEPLOY_TIMING %s %ss success\n' "$phase_name" "$(( $(date +%s) - phase_started ))"
                else
                  phase_status=$?
                  printf 'DEPLOY_TIMING %s %ss failed\n' "$phase_name" "$(( $(date +%s) - phase_started ))"
                  exit "$phase_status"
                fi
              }
              # Preserve SPS connectivity when Caddy is recreated. The external
              # network belongs to the separate SPS stack; do not recreate it.
              run_phase sps-network docker network inspect sps-proxy --format '{{.Name}}'
              run_phase compose-config docker compose -f docker-compose.yml -f docker-compose.ai-content.yml config --quiet
              run_phase pull docker compose pull
              run_phase migrations docker compose -f docker-compose.yml -f docker-compose.ai-content.yml run --rm --no-deps api python -m inventory_hub.migrate
              run_phase restart docker compose -f docker-compose.yml -f docker-compose.ai-content.yml up -d --force-recreate api frontend-build caddy
              readiness_started=$(date +%s)
              # Verify public health, anonymous denial and authenticated access.
              # The probe reads the configured token inside the container only.
              readiness_deadline=$(( $(date +%s) + 60 ))
              readiness_ok=false
              while [ "$(date +%s)" -lt "$readiness_deadline" ]; do
                readiness_remaining=$(( readiness_deadline - $(date +%s) ))
                if docker compose -f docker-compose.yml -f docker-compose.ai-content.yml exec -T api python -m inventory_hub.security_check --timeout "$readiness_remaining"; then
                  readiness_ok=true
                fi
                if [ "$readiness_ok" = true ]; then
                  break
                fi
                readiness_remaining=$(( readiness_deadline - $(date +%s) ))
                if [ "$readiness_remaining" -le 0 ]; then
                  break
                fi
                readiness_pause=3
                if [ "$readiness_remaining" -lt "$readiness_pause" ]; then
                  readiness_pause=$readiness_remaining
                fi
                sleep "$readiness_pause"
              done
              if [ "$readiness_ok" != true ]; then
                printf 'DEPLOY_TIMING readiness %ss failed\n' "$(( $(date +%s) - readiness_started ))"
                printf '%s\n' 'Deployment readiness failed within the 60-second limit.' >&2
                exit 1
              fi
              printf 'DEPLOY_TIMING readiness %ss success\n' "$(( $(date +%s) - readiness_started ))"
              run_phase sps-readiness curl --fail --silent --show-error --max-time 10 --retry 3 --retry-delay 2 --output /dev/null https://hub.biketrek.sk/sps/healthz
              run_phase cleanup docker image prune -f

  timing-summary:
    if: always()
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Summarize release timings
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_workflow_summary.py
