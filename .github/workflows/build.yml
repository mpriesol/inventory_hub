name: build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/mpriesol/inventory-hub-api:main
            ghcr.io/mpriesol/inventory-hub-api:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE=/api
          tags: |
            ghcr.io/mpriesol/inventory-hub-frontend:main
            ghcr.io/mpriesol/inventory-hub-frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
      needs: build-and-push
      runs-on: ubuntu-latest
      steps:
        - name: Deploy to hub.biketrek.sk
          uses: appleboy/ssh-action@v1.2.0
          with:
            host: ${{ secrets.DEPLOY_HOST }}
            username: ${{ secrets.DEPLOY_USER }}
            key: ${{ secrets.DEPLOY_SSH_KEY }}
            script: |
              set -eu
              cd /opt/inventory-hub
              if [ ! -f ai-content.env ]; then
                install -m 600 /dev/null ai-content.env
              fi
              cat > docker-compose.ai-content.yml <<'YAML'
              services:
                api:
                  volumes:
                    - ./ai-content.env:/run/secrets/hub-ai.env:ro
              YAML
              docker compose pull
              docker compose -f docker-compose.yml -f docker-compose.ai-content.yml run --rm --no-deps api python -m inventory_hub.ai_content_migrate
              docker compose -f docker-compose.yml -f docker-compose.ai-content.yml run --rm --no-deps api python -m inventory_hub.opening_stock_migrate
              docker compose -f docker-compose.yml -f docker-compose.ai-content.yml run --rm --no-deps api python -m inventory_hub.order_stock_migrate
              docker compose -f docker-compose.yml -f docker-compose.ai-content.yml run --rm --no-deps api python -m inventory_hub.order_collection_migrate
              docker compose -f docker-compose.yml -f docker-compose.ai-content.yml run --rm --no-deps api python -m inventory_hub.stock_automation_migrate
              docker compose -f docker-compose.yml -f docker-compose.ai-content.yml run --rm --no-deps api python -m inventory_hub.stock_publication_migrate
              docker compose -f docker-compose.yml -f docker-compose.ai-content.yml run --rm --no-deps api python -m inventory_hub.fifo_migrate
              docker compose -f docker-compose.yml -f docker-compose.ai-content.yml run --rm --no-deps api python -m inventory_hub.product_editor_migrate
              docker compose -f docker-compose.yml -f docker-compose.ai-content.yml run --rm --no-deps api python -m inventory_hub.receiving_scan_migrate
              docker compose -f docker-compose.yml -f docker-compose.ai-content.yml run --rm --no-deps api python -m inventory_hub.supplier_availability_migrate
              docker compose -f docker-compose.yml -f docker-compose.ai-content.yml run --rm --no-deps api python -m inventory_hub.stock_sync_migrate
              docker compose -f docker-compose.yml -f docker-compose.ai-content.yml run --rm --no-deps api python -m inventory_hub.product_publication_migrate
              docker compose -f docker-compose.yml -f docker-compose.ai-content.yml run --rm --no-deps api python -m inventory_hub.stock_adjustment_migrate
              docker compose -f docker-compose.yml -f docker-compose.ai-content.yml run --rm --no-deps api python -m inventory_hub.fifo_cost_migrate
              docker compose -f docker-compose.yml -f docker-compose.ai-content.yml run --rm --no-deps api python -m inventory_hub.stock_tracking_migrate
              docker compose -f docker-compose.yml -f docker-compose.ai-content.yml run --rm --no-deps api python -m inventory_hub.user_sessions_migrate
              docker compose -f docker-compose.yml -f docker-compose.ai-content.yml run --rm --no-deps api python -m inventory_hub.product_feed_mapping_migrate
              docker compose -f docker-compose.yml -f docker-compose.ai-content.yml run --rm --no-deps api python -m inventory_hub.product_import_migrate
              docker compose -f docker-compose.yml -f docker-compose.ai-content.yml up -d --force-recreate api frontend-build caddy
              # Both routes are public; allow startup without logging response bodies.
              readiness_deadline=$(( $(date +%s) + 60 ))
              readiness_ok=false
              while [ "$(date +%s)" -lt "$readiness_deadline" ]; do
                readiness_ok=true
                for readiness_path in health ai-content/status; do
                  readiness_remaining=$(( readiness_deadline - $(date +%s) ))
                  if [ "$readiness_remaining" -le 0 ]; then
                    readiness_ok=false
                    break
                  fi
                  readiness_timeout=5
                  if [ "$readiness_remaining" -lt "$readiness_timeout" ]; then
                    readiness_timeout=$readiness_remaining
                  fi
                  readiness_exit=0
                  readiness_status=$(curl --silent --fail --output /dev/null --write-out '%{http_code}' --connect-timeout "$readiness_timeout" --max-time "$readiness_timeout" "https://hub.biketrek.sk/api/$readiness_path") || readiness_exit=$?
                  printf 'Readiness /api/%s: HTTP %s (curl exit %s)\n' "$readiness_path" "$readiness_status" "$readiness_exit"
                  if [ "$readiness_exit" -ne 0 ] || [ "$readiness_status" != 200 ]; then
                    readiness_ok=false
                  fi
                done
                if [ "$readiness_ok" = true ]; then
                  break
                fi
                readiness_remaining=$(( readiness_deadline - $(date +%s) ))
                if [ "$readiness_remaining" -le 0 ]; then
                  break
                fi
                readiness_pause=3
                if [ "$readiness_remaining" -lt "$readiness_pause" ]; then
                  readiness_pause=$readiness_remaining
                fi
                sleep "$readiness_pause"
              done
              if [ "$readiness_ok" != true ]; then
                printf '%s\n' 'Deployment readiness failed within the 60-second limit.' >&2
                exit 1
              fi
              docker image prune -f
